{% extends "base.html" %}
{% block content %}
  <h1>Автомобили</h1>
  <div class="table-wrap">
    <table>
      <tr>
        <th>Госномер</th>
        <th>Автомобиль</th>
        <th>Цвет</th>
        <th>Действия</th>
      </tr>
      {% for car in cars %}
        <tr>
          <td>{{ car.plate }}</td>
          <td>
            <a href="{% url 'car_detail' car.pk %}">{{ car.brand }} {{ car.model }}</a>
          </td>
          <td>{{ car.color }}</td>
          <td>
            <a href="{% url 'car_update' car.pk %}">Изменить</a> · <a href="{% url 'car_delete' car.pk %}">Удалить</a>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="4">Нет автомобилей.</td>
        </tr>
      {% endfor %}
    </table>
  </div>
{% endblock %}
